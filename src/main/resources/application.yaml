# Settings shared by every environment. Environment-specific values (database
# credentials, log levels) live in application-<profile>.yaml.
spring:
  application:
    name: customer-service

  profiles:
    # Running with no -Dspring.profiles.active still gets a usable local setup.
    default: dev

  # Java 21 virtual threads: each request gets its own, no thread pool tuning needed.
  threads:
    virtual:
      enabled: true

  jpa:
    # Schema is owned by Flyway; Hibernate only validates it matches.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Avoid the default 60s block when no broker is reachable.
        max.block.ms: 5000

app:
  kafka:
    customer-events-topic: customer-events

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
